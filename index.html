<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Mentalista - Android TV Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070e;
      --card-bg: #0e1526;
      --card-focus: #1e2942;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.6);
      --tv-focus: #3b82f6;
      --tv-glow: rgba(59, 130, 246, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --gold: #f59e0b;
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 0;
      user-select: none;
    }

    /* Top Bar TV */
    header {
      background: linear-gradient(180deg, rgba(5,7,14,0.98) 0%, rgba(5,7,14,0.7) 100%);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      background: linear-gradient(135deg, #e50914, #990000);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.4rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: -0.5px;
    }
    .tv-controls-hint {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .dpad-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
    }

    .tv-layout {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 36px 60px 36px;
    }

    /* Reproductor Cinema TV */
    .cinema-viewport {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      border: 2px solid transparent;
      margin-bottom: 28px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .cinema-viewport:focus-within,
    .cinema-viewport.tv-focused {
      border-color: var(--tv-focus);
      box-shadow: 0 0 35px var(--tv-glow);
    }
    .video-frame-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Estricto */
      background: #000;
    }
    .video-frame-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Meta Info Bar */
    .tv-meta-bar {
      padding: 20px 28px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
    }
    .tv-meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .ep-current-title {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    .ep-current-tag {
      background: var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .ep-current-overview {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 1000px;
    }

    /* Focusable Elements Style */
    .focusable {
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s, background 0.2s;
    }
    .focusable:focus,
    .focusable.dpad-focus {
      transform: scale(1.06) !important;
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 25px var(--tv-glow) !important;
      z-index: 10;
    }

    /* Controles de Reproducción y Servidores */
    .tv-controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .tv-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tv-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Seasons Scroll */
    .seasons-scroll-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 10px 4px 18px 4px;
      margin-bottom: 26px;
      scrollbar-width: none;
    }
    .seasons-scroll-track::-webkit-scrollbar { display: none; }
    .season-card-pill {
      background: var(--card-bg);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .season-card-pill.active {
      background: var(--tv-focus);
      border-color: var(--tv-focus);
      color: #fff;
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.5);
    }

    /* Episodes Horizontal Carousel */
    .section-headline {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }
    .episodes-carousel {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 12px 6px 24px 6px;
      scrollbar-width: none;
    }
    .episodes-carousel::-webkit-scrollbar { display: none; }
    .tv-episode-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      flex: 0 0 320px;
      display: flex;
      flex-direction: column;
    }
    .tv-episode-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
    }
    .tv-thumb-frame {
      position: relative;
      width: 100%;
      height: 170px;
      background: #000;
    }
    .tv-thumb-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .tv-thumb-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--gold);
    }
    .tv-card-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .tv-card-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tv-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">M</div>
      <div><div class="brand-title">El Mentalista</div></div>
    </div>
    <div class="tv-controls-hint">
      <span>Navegación Control Remoto:</span>
      <span class="dpad-badge">▲ ▼ ◄ ►</span>
      <span class="dpad-badge">OK / Enter</span>
    </div>
  </header>

  <div class="tv-layout">
    <!-- Reproductor Cinema TV -->
    <div class="cinema-viewport" id="player-box">
      <div class="video-frame-box">
        <iframe id="tv-video-frame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <div class="tv-meta-bar">
        <div class="tv-meta-header">
          <div class="ep-current-title" id="now-title">Cargando episodio...</div>
          <div class="ep-current-tag" id="now-tag">T1 : E1</div>
        </div>
        <div class="ep-current-overview" id="now-desc">Patrick Jane y el CBI investigan casos sin resolver...</div>

        <!-- Servidores con botones grandes para control remoto -->
        <div class="tv-controls-row" id="servers-row"></div>

        <!-- Botones de Acción TV -->
        <div class="tv-controls-row">
          <button class="tv-btn focusable" tabindex="0" onclick="fullscreenVideo()">
            ⛶ Pantalla Completa
          </button>
          <button class="tv-btn focusable" tabindex="0" onclick="playNextEpisode()">
            ⏭️ Siguiente Episodio
          </button>
          <button class="tv-btn focusable" tabindex="0" onclick="reloadStream()">
            🔄 Recargar Reproductor
          </button>
        </div>
      </div>
    </div>

    <!-- Pestañas de Temporadas -->
    <div class="section-headline">📅 Temporadas:</div>
    <div class="seasons-scroll-track" id="seasons-track"></div>

    <!-- Carrusel Horizontal de Episodios -->
    <div class="section-headline" id="episodes-header">🎬 Episodios Temporada 1:</div>
    <div class="episodes-carousel" id="episodes-carousel"></div>
  </div>

  <script>
    let allEpisodes = [];
    let currentSeason = 1;
    let currentEp = null;
    let currentServer = null;

    async function initApp() {
      try {
        const res = await fetch('episodes.json');
        allEpisodes = await res.json();
        
        setupSeasons();
        selectSeason(1);

        // Auto-reproducir T1:E1 al encender
        if (allEpisodes.length > 0) {
          playEpisode(allEpisodes[0], false);
        }

        setupDpadNavigation();
      } catch (e) {
        console.error("Error al cargar la base de datos:", e);
      }
    }

    function setupSeasons() {
      const seasons = [...new Set(allEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const track = document.getElementById('seasons-track');
      track.innerHTML = '';

      seasons.forEach(s => {
        const tab = document.createElement('button');
        tab.className = `season-card-pill focusable ${s === currentSeason ? 'active' : ''}`;
        tab.tabIndex = 0;
        tab.textContent = `Temporada ${s}`;
        tab.onclick = () => selectSeason(s);
        tab.onkeydown = (e) => {
          if (e.key === 'Enter') selectSeason(s);
        };
        track.appendChild(tab);
      });
    }

    function selectSeason(seasonNum) {
      currentSeason = seasonNum;
      document.querySelectorAll('.season-card-pill').forEach((pill) => {
        pill.classList.toggle('active', pill.textContent === `Temporada ${seasonNum}`);
      });
      document.getElementById('episodes-header').textContent = `🎬 Episodios Temporada ${seasonNum}:`;
      renderEpisodes();
    }

    function renderEpisodes() {
      const filtered = allEpisodes.filter(e => e.season === currentSeason);
      const carousel = document.getElementById('episodes-carousel');
      carousel.innerHTML = '';

      filtered.forEach(ep => {
        const card = document.createElement('div');
        const isActive = currentEp && currentEp.season === ep.season && currentEp.episode === ep.episode;
        card.className = `tv-episode-card focusable ${isActive ? 'active' : ''}`;
        card.tabIndex = 0;

        card.onclick = () => playEpisode(ep, true);
        card.onkeydown = (e) => {
          if (e.key === 'Enter') playEpisode(ep, true);
        };

        const posterImg = ep.poster || 'https://image.tmdb.org/t/p/w500/snKUzvCl3kGv0RWBjEjnOXMGvdl.jpg';
        card.innerHTML = `
          <div class="tv-thumb-frame">
            <img src="${posterImg}" alt="T${ep.season} E${ep.episode}" loading="lazy">
            <div class="tv-thumb-badge">T${ep.season} : E${ep.episode}</div>
          </div>
          <div class="tv-card-content">
            <div class="tv-card-title">${ep.title}</div>
            <div class="tv-card-desc">${ep.overview || 'Sin descripción disponible.'}</div>
          </div>
        `;
        carousel.appendChild(card);
      });
    }

    function playEpisode(ep, scrollToTop = false) {
      currentEp = ep;
      renderEpisodes();

      document.getElementById('now-title').textContent = ep.title;
      document.getElementById('now-tag').textContent = `T${ep.season} : E${ep.episode}`;
      document.getElementById('now-desc').textContent = ep.overview || 'Patrick Jane y el equipo del CBI investigan casos sin resolver.';

      const serversRow = document.getElementById('servers-row');
      serversRow.innerHTML = '';

      if (!ep.servers || ep.servers.length === 0) {
        serversRow.innerHTML = '<span style="color:#ef4444;">Sin servidores disponibles.</span>';
        return;
      }

      currentServer = ep.servers[0];

      ep.servers.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = `tv-btn focusable ${idx === 0 ? 'active' : ''}`;
        btn.tabIndex = 0;
        btn.innerHTML = `<span>▶</span> <span>${srv.language} (${srv.server})</span>`;
        btn.onclick = () => {
          document.querySelectorAll('#servers-row .tv-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentServer = srv;
          loadStream(srv.embed_url);
        };
        btn.onkeydown = (e) => {
          if (e.key === 'Enter') btn.click();
        };
        serversRow.appendChild(btn);
      });

      loadStream(currentServer.embed_url);

      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function loadStream(url) {
      const frame = document.getElementById('tv-video-frame');
      frame.src = url;
    }

    function reloadStream() {
      if (currentServer) loadStream(currentServer.embed_url);
    }

    function playNextEpisode() {
      if (!currentEp) return;
      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx !== -1 && idx + 1 < allEpisodes.length) {
        const next = allEpisodes[idx + 1];
        if (next.season !== currentSeason) {
          selectSeason(next.season);
        }
        playEpisode(next, true);
      }
    }

    function fullscreenVideo() {
      const frame = document.getElementById('tv-video-frame');
      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      }
    }

    /* === NAVEGACIÓN D-PAD NATIVA PARA CONTROL REMOTO DE ANDROID TV === */
    function setupDpadNavigation() {
      window.addEventListener('keydown', (e) => {
        const active = document.activeElement;
        const focusables = Array.from(document.querySelectorAll('.focusable'));
        const index = focusables.indexOf(active);

        if (e.key === 'ArrowRight') {
          if (index !== -1 && index + 1 < focusables.length) {
            focusables[index + 1].focus();
            e.preventDefault();
          }
        } else if (e.key === 'ArrowLeft') {
          if (index > 0) {
            focusables[index - 1].focus();
            e.preventDefault();
          }
        } else if (e.key === 'ArrowDown') {
          // Si estamos en servidores/acciones, bajar a temporadas o episodios
          const nextRow = findNextRowElement(active, 'down');
          if (nextRow) {
            nextRow.focus();
            e.preventDefault();
          }
        } else if (e.key === 'ArrowUp') {
          const prevRow = findNextRowElement(active, 'up');
          if (prevRow) {
            prevRow.focus();
            e.preventDefault();
          }
        }
      });
    }

    function findNextRowElement(current, direction) {
      if (!current) return document.querySelector('.focusable');
      const currentRect = current.getBoundingClientRect();
      const allFocusables = Array.from(document.querySelectorAll('.focusable'));

      let bestCandidate = null;
      let minDistance = Infinity;

      allFocusables.forEach(target => {
        if (target === current) return;
        const targetRect = target.getBoundingClientRect();

        const isDown = direction === 'down' && targetRect.top >= currentRect.bottom - 5;
        const isUp = direction === 'up' && targetRect.bottom <= currentRect.top + 5;

        if (isDown || isUp) {
          const distY = Math.abs(targetRect.top - currentRect.top);
          const distX = Math.abs(targetRect.left - currentRect.left);
          const totalDist = distY * 2 + distX;

          if (totalDist < minDistance) {
            minDistance = totalDist;
            bestCandidate = target;
          }
        }
      });

      return bestCandidate;
    }

    initApp();
  </script>
</body>
</html>
