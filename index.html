<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>El Mentalista - Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040711;
      --surface: #0b1220;
      --card-bg: #111a2e;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.6);
      --tv-focus: #38bdf8;
      --tv-glow: rgba(56, 189, 248, 0.9);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* 1. CATÁLOGO */
    #catalog-view {
      padding: 30px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      background: linear-gradient(135deg, #e50914, #990000);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
    }
    .smart-server-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 16px;
      color: #fff;
    }

    .row-scroll-wrapper {
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 6px;
      margin-bottom: 36px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none; /* Firefox */
      scroll-behavior: smooth;
      cursor: grab;
    }
    .row-scroll-wrapper:active {
      cursor: grabbing;
    }
    .row-scroll-wrapper::-webkit-scrollbar {
      display: none; /* Chrome, Safari, TV WebKit */
    }
    .horizontal-row {
      display: flex;
      gap: 18px;
      width: max-content;
      will-change: transform, scroll-position;
    }

    /* Elementos con Foco */
    .tv-focus-item {
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
    }
    .tv-focus-item.is-focused {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 35px var(--tv-glow) !important;
      transform: scale(1.08) !important;
      z-index: 50 !important;
    }

    .season-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 16px 36px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .season-btn.selected {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
    }

    .ep-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      width: 330px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .ep-card-thumb {
      position: relative;
      width: 100%;
      height: 185px;
      background: #000;
    }
    .ep-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ep-badge-num {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--gold);
    }
    .ep-card-info {
      padding: 18px;
      flex: 1;
    }
    .ep-card-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* 2. REPRODUCTOR MODO CINE CON NAVEGACIÓN MANUAL INFERIOR */
    #player-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 7, 17, 0.98);
      z-index: 99999;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 20px 50px 20px;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    #player-view.active {
      display: flex;
    }

    .cinema-wrapper {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 0;
      padding-bottom: 56.25%; /* 16:9 ratio exacto */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.95), 0 0 0 1px var(--border);
      flex-shrink: 0;
    }

    .cinema-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    /* Barra de controles manuales abajo - 100% fuera de la ventana de video */
    .player-bottom-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
      padding: 16px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      flex-shrink: 0;
    }
    .player-info-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 240px;
    }
    .player-ep-code {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.5px;
    }
    .player-ep-title {
      font-size: 1.25rem;
      font-weight: 900;
      color: #fff;
    }
    .player-manual-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .player-nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .player-nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }
    .player-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .player-nav-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    .player-nav-btn.primary:hover:not(:disabled) {
      background: #c50812;
      border-color: #c50812;
    }
    .player-nav-btn:focus,
    .player-nav-btn.is-focused {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 20px var(--tv-glow) !important;
      transform: scale(1.05);
    }


  </style>
</head>
<body>

  <!-- 1. VISTA CATÁLOGO -->
  <div id="catalog-view">
    <header>
      <div class="brand">
        <div class="brand-icon">M</div>
        <div class="brand-title">El Mentalista</div>
      </div>
      <div class="smart-server-badge">
        <span>⚡ Servidor Óptimo Automático</span>
      </div>
    </header>

    <div class="section-title">📅 Temporadas (1 a 7):</div>
    <div class="row-scroll-wrapper">
      <div class="horizontal-row" id="seasons-row"></div>
    </div>

    <div class="section-title" id="episodes-title">🎬 Episodios Temporada 1:</div>
    <div class="row-scroll-wrapper">
      <div class="horizontal-row" id="episodes-row"></div>
    </div>
  </div>

  <!-- 2. VISTA REPRODUCTOR MODO CINE -->
  <div id="player-view">
    <div class="cinema-wrapper">
      <div id="cinema-frame-container" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Barra de navegación manual inferior -->
    <div class="player-bottom-bar">
      <div class="player-info-meta">
        <span class="player-ep-code" id="cinema-ep-code">TEMPORADA 1 : EPISODIO 1</span>
        <span class="player-ep-title" id="cinema-ep-title">Cargando episodio...</span>
      </div>
      <div class="player-manual-nav">
        <button class="player-nav-btn" id="btn-cinema-prev" onclick="playPreviousEpisode()" title="Episodio Anterior">
          ⏮ Capítulo Anterior
        </button>
        <button class="player-nav-btn primary" id="btn-cinema-next" onclick="playNextEpisode()" title="Siguiente Episodio">
          Siguiente Capítulo ⏭
        </button>
        <button class="player-nav-btn" id="btn-cinema-back-catalog" onclick="closePlayerView()" title="Volver a la lista">
          ☰ Catálogo
        </button>
      </div>
    </div>
  </div>

  <script>
    let allEpisodes = [];
    let currentSeason = 1;
    let currentEp = null;

    let currentRow = 0;
    let currentCol = 0;
    let isPlaying = false;

    const SERVER_PRIORITY = [
      "hyper",
      "morencius",
      "nebula",
      "martinshop",
      "goldmember",
      "death star",
      "vidlink",
      "trinity"
    ];

    function pickBestServer(servers) {
      if (!servers || servers.length === 0) return "";
      for (const rank of SERVER_PRIORITY) {
        const match = servers.find(s => 
          (s.server && s.server.toLowerCase().includes(rank)) ||
          (s.embed_url && s.embed_url.toLowerCase().includes(rank))
        );
        if (match) return match.embed_url;
      }
      return servers[0].embed_url;
    }

    async function init() {
      try {
        const res = await fetch('episodes.json?v=' + Date.now());
        allEpisodes = await res.json();

        renderSeasons();
        selectSeason(1);

        setupDpadController();
        updateFocusUI();
        checkUrlRouteOnLoad();
      } catch (e) {
        console.error("Error cargando episodios:", e);
      }
    }

    function renderSeasons() {
      const seasons = [...new Set(allEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const row = document.getElementById('seasons-row');
      row.innerHTML = '';

      seasons.forEach((s, idx) => {
        const btn = document.createElement('div');
        btn.className = `season-btn tv-focus-item ${s === currentSeason ? 'selected' : ''}`;
        btn.dataset.row = '0';
        btn.dataset.col = idx;
        btn.textContent = `Temporada ${s}`;
        btn.onclick = () => {
          selectSeason(s);
          setFocus(0, idx);
        };
        row.appendChild(btn);
      });
    }

    function selectSeason(seasonNum) {
      currentSeason = seasonNum;
      document.querySelectorAll('.season-btn').forEach((btn, idx) => {
        btn.classList.toggle('selected', idx + 1 === seasonNum);
      });
      const filtered = allEpisodes.filter(e => e.season === seasonNum);
      document.getElementById('episodes-title').textContent = `🎬 Episodios Temporada ${seasonNum} (${filtered.length} Capítulos):`;
      renderEpisodes();
      const epWrapper = document.getElementById('episodes-row').closest('.row-scroll-wrapper');
      if (epWrapper) epWrapper.scrollTo({ left: 0, behavior: 'smooth' });
    }

    function renderEpisodes() {
      const filtered = allEpisodes.filter(e => e.season === currentSeason);
      const row = document.getElementById('episodes-row');
      row.innerHTML = '';

      filtered.forEach((ep, idx) => {
        const card = document.createElement('div');
        card.className = `ep-card tv-focus-item`;
        card.dataset.row = '1';
        card.dataset.col = idx;

        card.onclick = () => {
          launchEpisode(ep);
        };

        const posterImg = ep.poster || 'https://image.tmdb.org/t/p/w500/snKUzvCl3kGv0RWBjEjnOXMGvdl.jpg';
        card.innerHTML = `
          <div class="ep-card-thumb">
            <img src="${posterImg}" alt="T${ep.season} E${ep.episode}">
            <div class="ep-badge-num">T${ep.season} : E${ep.episode}</div>
          </div>
          <div class="ep-card-info">
            <div class="ep-card-title">${ep.title}</div>
            <div class="ep-card-desc">${ep.overview || 'Sin descripción disponible.'}</div>
          </div>
        `;
        row.appendChild(card);
      });
    }

    function updateUrlForEpisode(ep) {
      if (ep) {
        const newHash = `#s${ep.season}e${ep.episode}`;
        if (window.location.hash !== newHash) {
          window.location.hash = newHash;
        }
      } else {
        if (window.location.hash && window.location.hash !== '#') {
          history.pushState("", document.title, window.location.pathname + window.location.search);
        }
      }
    }

    function parseEpisodeFromHash() {
      const hash = window.location.hash || '';
      // Formato #s1e5 o #s=1&e=5 o search params
      const matchHash = hash.match(/#s(\d+)e(\d+)/i);
      if (matchHash) {
        return { season: parseInt(matchHash[1], 10), episode: parseInt(matchHash[2], 10) };
      }
      const urlParams = new URLSearchParams(window.location.search);
      const s = parseInt(urlParams.get('s'), 10);
      const e = parseInt(urlParams.get('e'), 10);
      if (!isNaN(s) && !isNaN(e)) {
        return { season: s, episode: e };
      }
      return null;
    }

    function checkUrlRouteOnLoad() {
      const route = parseEpisodeFromHash();
      if (route) {
        const found = allEpisodes.find(ep => ep.season === route.season && ep.episode === route.episode);
        if (found) {
          selectSeason(found.season);
          launchEpisode(found, false);
        }
      }
    }

    window.addEventListener('hashchange', () => {
      const route = parseEpisodeFromHash();
      if (route) {
        const found = allEpisodes.find(ep => ep.season === route.season && ep.episode === route.episode);
        if (found) {
          if (found.season !== currentSeason) selectSeason(found.season);
          launchEpisode(found, false);
          return;
        }
      }
      // Si el hash se limpió (al darle botón atrás del navegador), volver a la lista completa
      if (isPlaying) {
        closePlayerView(false);
      }
    });

    window.addEventListener('popstate', () => {
      const route = parseEpisodeFromHash();
      if (!route && isPlaying) {
        closePlayerView(false);
      }
    });

    function launchEpisode(ep, updateHistory = true) {
      currentEp = ep;
      isPlaying = true;

      // Actualizar información en la barra de controles inferior
      const epCodeEl = document.getElementById('cinema-ep-code');
      const epTitleEl = document.getElementById('cinema-ep-title');
      if (epCodeEl) epCodeEl.textContent = `TEMPORADA ${ep.season} : EPISODIO ${ep.episode}`;
      if (epTitleEl) epTitleEl.textContent = ep.title;

      // Actualizar estados de botones Anterior y Siguiente
      const idx = allEpisodes.findIndex(e => e.season === ep.season && e.episode === ep.episode);
      const prevBtn = document.getElementById('btn-cinema-prev');
      const nextBtn = document.getElementById('btn-cinema-next');
      if (prevBtn) prevBtn.disabled = (idx <= 0);
      if (nextBtn) nextBtn.disabled = (idx === -1 || idx >= allEpisodes.length - 1);

      // Cargar iframe de streaming limpio
      const bestUrl = pickBestServer(ep.servers);
      const container = document.getElementById('cinema-frame-container');
      container.innerHTML = '';

      const frame = document.createElement('iframe');
      frame.id = 'cinema-frame';
      frame.className = 'cinema-frame';
      frame.allowFullscreen = true;
      frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      frame.removeAttribute('sandbox');
      frame.src = bestUrl;
      container.appendChild(frame);

      document.getElementById('catalog-view').style.display = 'none';
      const playerEl = document.getElementById('player-view');
      playerEl.classList.add('active');

      if (updateHistory) {
        updateUrlForEpisode(ep);
      }
    }

    function playPreviousEpisode() {
      if (!currentEp) return;
      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx > 0) {
        const prev = allEpisodes[idx - 1];
        if (prev.season !== currentSeason) {
          selectSeason(prev.season);
        }
        launchEpisode(prev, true);
      }
    }

    function playNextEpisode() {
      if (!currentEp) return;
      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx !== -1 && idx + 1 < allEpisodes.length) {
        const next = allEpisodes[idx + 1];
        if (next.season !== currentSeason) {
          selectSeason(next.season);
        }
        launchEpisode(next, true);
      }
    }

    function closePlayerView(updateHistory = true) {
      isPlaying = false;
      const playerEl = document.getElementById('player-view');
      playerEl.classList.remove('active');
      const container = document.getElementById('cinema-frame-container');
      if (container) container.innerHTML = '';
      document.getElementById('catalog-view').style.display = 'block';

      if (updateHistory) {
        if (window.location.hash && window.location.hash.startsWith('#s')) {
          window.history.back();
        } else {
          updateUrlForEpisode(null);
        }
      }

      setFocus(1, currentCol);
    }

    /* === NAVEGACIÓN D-PAD CONTROL REMOTO === */
    function setupDpadController() {
      window.addEventListener('keydown', (e) => {
        if (isPlaying) {
          // Tecla Atrás del control remoto o navegador lleva a la lista completa
          if (e.key === 'Back' || e.key === 'Escape' || e.key === 'BrowserBack') {
            closePlayerView();
            e.preventDefault();
            return;
          }

          // Navegación con flechas en controles de cine
          if (e.key === 'ArrowLeft' || e.key === 'Left') {
            const prevBtn = document.getElementById('btn-cinema-prev');
            if (prevBtn) prevBtn.focus();
            e.preventDefault();
            return;
          }

          if (e.key === 'ArrowRight' || e.key === 'Right') {
            const nextBtn = document.getElementById('btn-cinema-next');
            if (nextBtn) nextBtn.focus();
            e.preventDefault();
            return;
          }

          if (e.key === 'ArrowDown' || e.key === 'Down') {
            const catalogBtn = document.getElementById('btn-cinema-back-catalog');
            if (catalogBtn) catalogBtn.focus();
            e.preventDefault();
            return;
          }

          if (e.key === 'Enter' || e.key === 'Ok') {
            if (document.activeElement && document.activeElement.click) {
              document.activeElement.click();
              e.preventDefault();
            }
            return;
          }
          return;
        }

        switch (e.key) {
          case 'ArrowUp':
          case 'Up':
            moveRow(-1);
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 'Down':
            moveRow(1);
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'Left':
            moveCol(-1);
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'Right':
            moveCol(1);
            e.preventDefault();
            break;
          case 'Enter':
          case 'Select':
          case 'Ok':
            triggerSelection();
            e.preventDefault();
            break;
        }
      });
    }

    function getRowItems(row) {
      return Array.from(document.querySelectorAll(`.tv-focus-item[data-row="${row}"]`));
    }

    function moveRow(delta) {
      let nextRow = currentRow + delta;
      if (nextRow >= 0 && nextRow <= 1) {
        currentRow = nextRow;
        const items = getRowItems(currentRow);
        currentCol = Math.min(currentCol, items.length - 1);
        updateFocusUI();
      }
    }

    function moveCol(delta) {
      const items = getRowItems(currentRow);
      if (items.length === 0) return;
      currentCol = Math.max(0, Math.min(currentCol + delta, items.length - 1));
      updateFocusUI();
    }

    function setFocus(row, col) {
      currentRow = row;
      currentCol = col;
      updateFocusUI();
    }

    function updateFocusUI() {
      document.querySelectorAll('.is-focused').forEach(el => el.classList.remove('is-focused'));

      const items = getRowItems(currentRow);
      if (items.length === 0) return;
      const target = items[currentCol] || items[0];
      target.classList.add('is-focused');

      const container = target.closest('.row-scroll-wrapper');
      if (container) {
        const targetOffsetLeft = target.offsetLeft;
        const centerOffset = (container.clientWidth / 2) - (target.offsetWidth / 2);
        const scrollX = Math.max(0, targetOffsetLeft - centerOffset);
        container.scrollTo({ left: scrollX, behavior: 'smooth' });
      }
    }

    function triggerSelection() {
      const items = getRowItems(currentRow);
      const target = items[currentCol];
      if (target) target.click();
    }

    function setupDragToScroll() {
      document.querySelectorAll('.row-scroll-wrapper').forEach(wrapper => {
        let isDown = false;
        let startX;
        let scrollLeft;

        wrapper.addEventListener('mousedown', (e) => {
          isDown = true;
          wrapper.classList.add('active');
          startX = e.pageX - wrapper.offsetLeft;
          scrollLeft = wrapper.scrollLeft;
        });

        wrapper.addEventListener('mouseleave', () => {
          isDown = false;
        });

        wrapper.addEventListener('mouseup', () => {
          isDown = false;
        });

        wrapper.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - wrapper.offsetLeft;
          const walk = (x - startX) * 1.5; // Velocidad de arrastre
          wrapper.scrollLeft = scrollLeft - walk;
        });
      });
    }

    setupDpadController();
    init();
    setTimeout(setupDragToScroll, 500);
  </script>
</body>
</html>
