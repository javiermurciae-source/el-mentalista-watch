<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Mentalista - Android TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040711;
      --surface: #0b1220;
      --card-bg: #111a2e;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.6);
      --tv-focus: #38bdf8;
      --tv-glow: rgba(56, 189, 248, 0.9);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* 1. VISTA CATÁLOGO (CERO REPRODUCTORES Y CERO SERVIDORES VISIBLES) */
    #catalog-view {
      padding: 30px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      background: linear-gradient(135deg, #e50914, #990000);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
    }
    .smart-server-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 16px;
      color: #fff;
    }

    /* Filas Horizontales con Desplazamiento Suave */
    .row-scroll-wrapper {
      position: relative;
      overflow-x: hidden;
      padding: 12px 6px;
      margin-bottom: 36px;
    }
    .horizontal-row {
      display: flex;
      gap: 18px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    /* Elementos con Foco para Control Remoto */
    .tv-focus-item {
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
    }
    .tv-focus-item.is-focused {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 35px var(--tv-glow) !important;
      transform: scale(1.08) !important;
      z-index: 50 !important;
    }

    /* Botones de Temporadas */
    .season-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 16px 36px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .season-btn.selected {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
    }

    /* Tarjetas de Episodios */
    .ep-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      width: 330px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .ep-card-thumb {
      position: relative;
      width: 100%;
      height: 185px;
      background: #000;
    }
    .ep-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ep-badge-num {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--gold);
    }
    .ep-card-info {
      padding: 18px;
      flex: 1;
    }
    .ep-card-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* 2. VISTA REPRODUCTOR A PANTALLA COMPLETA 100% LIMPIA */
    #player-view {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
    }
    #player-view.active {
      display: block;
    }
    .video-full-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Floating Controls: Aparecen solo al tocar una tecla y desaparecen en 3s */
    .floating-tv-hud {
      position: absolute;
      top: 24px;
      right: 36px;
      display: flex;
      gap: 14px;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .floating-tv-hud.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .hud-button {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-button.primary {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .hud-button:focus,
    .hud-button.is-focused {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 30px var(--tv-glow) !important;
      transform: scale(1.06);
    }
  </style>
</head>
<body>

  <!-- 1. VISTA CATÁLOGO (Solo Temporadas y Episodios, sin servidores flotantes) -->
  <div id="catalog-view">
    <header>
      <div class="brand">
        <div class="brand-icon">M</div>
        <div class="brand-title">El Mentalista</div>
      </div>
      <div class="smart-server-badge">
        <span>⚡ Servidor Óptimo Automático</span>
      </div>
    </header>

    <!-- Fila 0: Temporadas -->
    <div class="section-title">📅 Temporadas (1 a 7):</div>
    <div class="row-scroll-wrapper">
      <div class="horizontal-row" id="seasons-row"></div>
    </div>

    <!-- Fila 1: Episodios de la Temporada -->
    <div class="section-title" id="episodes-title">🎬 Episodios Temporada 1:</div>
    <div class="row-scroll-wrapper">
      <div class="horizontal-row" id="episodes-row"></div>
    </div>
  </div>

  <!-- 2. VISTA REPRODUCTOR A PANTALLA COMPLETA PURA -->
  <div id="player-view">
    <!-- Controles flotantes discretos que desaparecen solos -->
    <div class="floating-tv-hud" id="tv-hud">
      <button class="hud-button primary tv-hud-item" id="btn-hud-next" onclick="playNextEpisode()">
        ⏭️ Siguiente Episodio
      </button>
      <button class="hud-button tv-hud-item" id="btn-hud-exit" onclick="closePlayerView()">
        ✖ Salir al Menú
      </button>
    </div>

    <iframe id="cinema-frame" class="video-full-frame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <script>
    let allEpisodes = [];
    let currentSeason = 1;
    let currentEp = null;

    // Fila 0: Temporadas | Fila 1: Episodios
    let currentRow = 0;
    let currentCol = 0;
    let isPlaying = false;
    let hudTimer = null;
    let autoPlayTimer = null;

    const SERVER_PRIORITY = [
      "hyper",
      "morencius",
      "nebula",
      "martinshop",
      "goldmember",
      "death star",
      "vidlink",
      "trinity"
    ];

    function pickBestServer(servers) {
      if (!servers || servers.length === 0) return "";
      for (const rank of SERVER_PRIORITY) {
        const match = servers.find(s => 
          (s.server && s.server.toLowerCase().includes(rank)) ||
          (s.embed_url && s.embed_url.toLowerCase().includes(rank))
        );
        if (match) return match.embed_url;
      }
      return servers[0].embed_url;
    }

    async function init() {
      try {
        const res = await fetch('episodes.json');
        allEpisodes = await res.json();

        renderSeasons();
        selectSeason(1);

        setupDpadController();
        updateFocusUI();
      } catch (e) {
        console.error("Error al cargar episodios:", e);
      }
    }

    function renderSeasons() {
      const seasons = [...new Set(allEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const row = document.getElementById('seasons-row');
      row.innerHTML = '';

      seasons.forEach((s, idx) => {
        const btn = document.createElement('div');
        btn.className = `season-btn tv-focus-item ${s === currentSeason ? 'selected' : ''}`;
        btn.dataset.row = '0';
        btn.dataset.col = idx;
        btn.textContent = `Temporada ${s}`;
        btn.onclick = () => {
          selectSeason(s);
          setFocus(0, idx);
        };
        row.appendChild(btn);
      });
    }

    function selectSeason(seasonNum) {
      currentSeason = seasonNum;
      document.querySelectorAll('.season-btn').forEach((btn, idx) => {
        btn.classList.toggle('selected', idx + 1 === seasonNum);
      });
      document.getElementById('episodes-title').textContent = `🎬 Episodios Temporada ${seasonNum}:`;
      renderEpisodes();
    }

    function renderEpisodes() {
      const filtered = allEpisodes.filter(e => e.season === currentSeason);
      const row = document.getElementById('episodes-row');
      row.innerHTML = '';

      filtered.forEach((ep, idx) => {
        const card = document.createElement('div');
        card.className = `ep-card tv-focus-item`;
        card.dataset.row = '1';
        card.dataset.col = idx;

        card.onclick = () => {
          launchEpisode(ep);
        };

        const posterImg = ep.poster || 'https://image.tmdb.org/t/p/w500/snKUzvCl3kGv0RWBjEjnOXMGvdl.jpg';
        card.innerHTML = `
          <div class="ep-card-thumb">
            <img src="${posterImg}" alt="T${ep.season} E${ep.episode}">
            <div class="ep-badge-num">T${ep.season} : E${ep.episode}</div>
          </div>
          <div class="ep-card-info">
            <div class="ep-card-title">${ep.title}</div>
            <div class="ep-card-desc">${ep.overview || 'Sin descripción disponible.'}</div>
          </div>
        `;
        row.appendChild(card);
      });
    }

    /* === ABRIR REPRODUCTOR 100% PANTALLA COMPLETA === */
    function launchEpisode(ep) {
      currentEp = ep;
      isPlaying = true;

      // Selección automática transparente del mejor servidor (Morencius / Hyper)
      const bestUrl = pickBestServer(ep.servers);
      document.getElementById('cinema-frame').src = bestUrl;

      // Ocultar catálogo y activar pantalla completa
      document.getElementById('catalog-view').style.display = 'none';
      document.getElementById('player-view').classList.add('active');

      showHudTemp();
      scheduleAutoPlay();
    }

    function closePlayerView() {
      isPlaying = false;
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('cinema-frame').src = '';
      document.getElementById('catalog-view').style.display = 'block';

      if (autoPlayTimer) clearTimeout(autoPlayTimer);
      setFocus(1, currentCol);
    }

    function playNextEpisode() {
      if (!currentEp) return;
      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx !== -1 && idx + 1 < allEpisodes.length) {
        const next = allEpisodes[idx + 1];
        if (next.season !== currentSeason) {
          selectSeason(next.season);
        }
        launchEpisode(next);
      } else {
        alert("¡Has llegado al final de la serie!");
        closePlayerView();
      }
    }

    function scheduleAutoPlay() {
      if (autoPlayTimer) clearTimeout(autoPlayTimer);

      window.addEventListener('message', (e) => {
        if (!e.data) return;
        const msg = JSON.stringify(e.data).toLowerCase();
        if (msg.includes('ended') || msg.includes('complete')) {
          playNextEpisode();
        }
      });

      // Auto-reproducir tras duración estándar
      autoPlayTimer = setTimeout(() => {
        playNextEpisode();
      }, 43 * 60 * 1000);
    }

    function showHudTemp() {
      const hud = document.getElementById('tv-hud');
      hud.classList.add('visible');
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        hud.classList.remove('visible');
      }, 3500);
    }

    /* === NAVEGACIÓN D-PAD CONTROL REMOTO === */
    function setupDpadController() {
      window.addEventListener('keydown', (e) => {
        if (isPlaying) {
          // Tecla Atrás en control remoto
          if (e.key === 'Back' || e.key === 'Escape' || e.key === 'BrowserBack') {
            closePlayerView();
            e.preventDefault();
            return;
          }

          showHudTemp();

          if (e.key === 'ArrowLeft') {
            document.getElementById('btn-hud-next').focus();
            e.preventDefault();
          } else if (e.key === 'ArrowRight') {
            document.getElementById('btn-hud-exit').focus();
            e.preventDefault();
          } else if (e.key === 'Enter') {
            if (document.activeElement && document.activeElement.click) {
              document.activeElement.click();
            }
          }
          return;
        }

        switch (e.key) {
          case 'ArrowUp':
          case 'Up':
            moveRow(-1);
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 'Down':
            moveRow(1);
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'Left':
            moveCol(-1);
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'Right':
            moveCol(1);
            e.preventDefault();
            break;
          case 'Enter':
          case 'Select':
          case 'Ok':
            triggerSelection();
            e.preventDefault();
            break;
        }
      });
    }

    function getRowItems(row) {
      return Array.from(document.querySelectorAll(`.tv-focus-item[data-row="${row}"]`));
    }

    function moveRow(delta) {
      let nextRow = currentRow + delta;
      if (nextRow >= 0 && nextRow <= 1) {
        currentRow = nextRow;
        const items = getRowItems(currentRow);
        currentCol = Math.min(currentCol, items.length - 1);
        updateFocusUI();
      }
    }

    function moveCol(delta) {
      const items = getRowItems(currentRow);
      if (items.length === 0) return;
      currentCol = Math.max(0, Math.min(currentCol + delta, items.length - 1));
      updateFocusUI();
    }

    function setFocus(row, col) {
      currentRow = row;
      currentCol = col;
      updateFocusUI();
    }

    function updateFocusUI() {
      document.querySelectorAll('.is-focused').forEach(el => el.classList.remove('is-focused'));

      const items = getRowItems(currentRow);
      if (items.length === 0) return;
      const target = items[currentCol] || items[0];
      target.classList.add('is-focused');

      const track = target.parentElement;
      const targetOffsetLeft = target.offsetLeft;
      const centerOffset = (window.innerWidth / 2) - (target.offsetWidth / 2);
      const scrollX = Math.max(0, targetOffsetLeft - centerOffset);
      track.style.transform = `translateX(-${scrollX}px)`;

      target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function triggerSelection() {
      const items = getRowItems(currentRow);
      const target = items[currentCol];
      if (target) target.click();
    }

    init();
  </script>
</body>
</html>
