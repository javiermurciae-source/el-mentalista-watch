<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Mentalista - Android TV Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060913;
      --surface: #0f172a;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.6);
      --tv-focus: #38bdf8;
      --tv-glow: rgba(56, 189, 248, 0.8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px;
      user-select: none;
    }

    header {
      background: rgba(6, 9, 19, 0.95);
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-icon {
      background: linear-gradient(135deg, #e50914, #990000);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.4rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: -0.4px;
    }
    .tv-controls-hint {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 700;
    }
    .tv-key-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
    }

    .tv-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 40px;
    }

    /* Video Player */
    .player-section {
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      border: 2px solid transparent;
      margin-bottom: 28px;
      position: relative;
    }
    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background: #000;
    }
    .video-viewport iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Meta bar */
    .player-details {
      padding: 20px 28px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .details-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .current-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.4px;
    }
    .current-badge {
      background: var(--accent);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 900;
      text-transform: uppercase;
    }
    .current-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 1050px;
    }

    /* Focus styling */
    .tv-target {
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s, background 0.2s;
    }
    .tv-target.tv-active-focus {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 30px var(--tv-glow) !important;
      transform: scale(1.08) !important;
      z-index: 50 !important;
    }

    /* Action buttons & servers row */
    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .tv-button {
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tv-button.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Seasons Track */
    .row-title {
      font-size: 1.25rem;
      font-weight: 900;
      margin-bottom: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .horizontal-scroll-container {
      position: relative;
      overflow-x: hidden;
      margin-bottom: 30px;
      padding: 14px 4px;
    }
    .horizontal-track {
      display: flex;
      gap: 16px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }
    .season-pill {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 14px 30px;
      border-radius: 14px;
      font-size: 1.15rem;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .season-pill.selected {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
    }

    /* Episodes Cards Carousel */
    .episode-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .episode-card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
    }
    .card-thumb {
      position: relative;
      width: 100%;
      height: 175px;
      background: #020409;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--gold);
    }
    .card-body {
      padding: 16px;
      flex: 1;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 900;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">M</div>
      <div><div class="brand-title">El Mentalista</div></div>
    </div>
    <div class="tv-controls-hint">
      <span>Navegar con Control Remoto:</span>
      <span class="tv-key-pill">▲ ▼ ◄ ►</span>
      <span class="tv-key-pill">OK</span>
    </div>
  </header>

  <div class="tv-container">
    <!-- Reproductor -->
    <div class="player-section">
      <div class="video-viewport">
        <iframe id="tv-frame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="player-details">
        <div class="details-row">
          <div class="current-title" id="now-title">Cargando episodio...</div>
          <div class="current-badge" id="now-tag">T1 E1</div>
        </div>
        <div class="current-desc" id="now-desc">Patrick Jane investiga crímenes complejos junto al CBI.</div>

        <!-- Fila 0: Servidores de Video -->
        <div class="control-row" id="row-servers"></div>

        <!-- Fila 1: Botones de Acción -->
        <div class="control-row" id="row-actions">
          <button class="tv-button tv-target" data-row="1" onclick="fullscreenVideo()">
            ⛶ Pantalla Completa
          </button>
          <button class="tv-button tv-target" data-row="1" onclick="nextEpisode()">
            ⏭️ Siguiente Episodio
          </button>
          <button class="tv-button tv-target" data-row="1" onclick="reloadVideo()">
            🔄 Recargar Video
          </button>
        </div>
      </div>
    </div>

    <!-- Fila 2: Selector de Temporadas -->
    <div class="row-title">📅 Temporadas (1 - 7):</div>
    <div class="horizontal-scroll-container">
      <div class="horizontal-track" id="seasons-track"></div>
    </div>

    <!-- Fila 3: Carrusel de Episodios -->
    <div class="row-title" id="episodes-row-title">🎬 Episodios Temporada 1:</div>
    <div class="horizontal-scroll-container">
      <div class="horizontal-track" id="episodes-track"></div>
    </div>
  </div>

  <script>
    let allEpisodes = [];
    let currentSeason = 1;
    let currentEp = null;
    let currentServer = null;

    // Estado de Foco TV: { row: 0..3, col: 0..N }
    // Fila 0: Servidores
    // Fila 1: Acciones (Pantalla completa, siguiente, recargar)
    // Fila 2: Temporadas
    // Fila 3: Episodios
    let currentRow = 2; // Iniciar en Temporadas
    let currentCol = 0;

    async function init() {
      try {
        const res = await fetch('episodes.json');
        allEpisodes = await res.json();

        buildSeasons();
        buildEpisodes();

        if (allEpisodes.length > 0) {
          playEp(allEpisodes[0], false);
        }

        // Registrar navegación por teclado / D-Pad
        initDpadController();
        updateFocusUI();
      } catch (err) {
        console.error("Error al cargar:", err);
      }
    }

    function buildSeasons() {
      const seasons = [...new Set(allEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const track = document.getElementById('seasons-track');
      track.innerHTML = '';

      seasons.forEach((s, idx) => {
        const pill = document.createElement('div');
        pill.className = `season-pill tv-target ${s === currentSeason ? 'selected' : ''}`;
        pill.dataset.row = '2';
        pill.dataset.col = idx;
        pill.textContent = `Temporada ${s}`;
        pill.onclick = () => {
          setSeason(s);
          setFocus(2, idx);
        };
        track.appendChild(pill);
      });
    }

    function setSeason(seasonNum) {
      currentSeason = seasonNum;
      document.querySelectorAll('.season-pill').forEach((p, idx) => {
        p.classList.toggle('selected', idx + 1 === seasonNum);
      });
      document.getElementById('episodes-row-title').textContent = `🎬 Episodios Temporada ${seasonNum}:`;
      buildEpisodes();
    }

    function buildEpisodes() {
      const filtered = allEpisodes.filter(e => e.season === currentSeason);
      const track = document.getElementById('episodes-track');
      track.innerHTML = '';

      filtered.forEach((ep, idx) => {
        const card = document.createElement('div');
        const isActive = currentEp && currentEp.season === ep.season && currentEp.episode === ep.episode;
        card.className = `episode-card tv-target ${isActive ? 'selected' : ''}`;
        card.dataset.row = '3';
        card.dataset.col = idx;

        card.onclick = () => {
          playEp(ep, true);
          setFocus(3, idx);
        };

        const posterImg = ep.poster || 'https://image.tmdb.org/t/p/w500/snKUzvCl3kGv0RWBjEjnOXMGvdl.jpg';
        card.innerHTML = `
          <div class="card-thumb">
            <img src="${posterImg}" alt="T${ep.season} E${ep.episode}">
            <div class="card-badge">T${ep.season} : E${ep.episode}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${ep.title}</div>
            <div class="card-desc">${ep.overview || 'Sin descripción disponible.'}</div>
          </div>
        `;
        track.appendChild(card);
      });
    }

    function playEp(ep, scrollToTop = false) {
      currentEp = ep;
      document.getElementById('now-title').textContent = ep.title;
      document.getElementById('now-tag').textContent = `T${ep.season} : E${ep.episode}`;
      document.getElementById('now-desc').textContent = ep.overview || 'Patrick Jane y el equipo del CBI investigan este caso.';

      // Actualizar tarjetas de episodios seleccionadas
      document.querySelectorAll('.episode-card').forEach((c) => {
        const badge = c.querySelector('.card-badge');
        c.classList.toggle('selected', badge && badge.textContent === `T${ep.season} : E${ep.episode}`);
      });

      // Construir Fila 0 (Servidores)
      const serversRow = document.getElementById('row-servers');
      serversRow.innerHTML = '';

      if (!ep.servers || ep.servers.length === 0) {
        serversRow.innerHTML = '<span style="color:#ef4444;">Sin servidores.</span>';
        return;
      }

      currentServer = ep.servers[0];

      ep.servers.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = `tv-button tv-target ${idx === 0 ? 'selected' : ''}`;
        btn.dataset.row = '0';
        btn.dataset.col = idx;
        btn.innerHTML = `<span>▶</span> <span>${srv.language} (${srv.server})</span>`;
        btn.onclick = () => {
          document.querySelectorAll('#row-servers .tv-button').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          currentServer = srv;
          loadVideoUrl(srv.embed_url);
          setFocus(0, idx);
        };
        serversRow.appendChild(btn);
      });

      loadVideoUrl(currentServer.embed_url);

      if (scrollToTop) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function loadVideoUrl(url) {
      document.getElementById('tv-frame').src = url;
    }

    function reloadVideo() {
      if (currentServer) loadVideoUrl(currentServer.embed_url);
    }

    function nextEpisode() {
      if (!currentEp) return;
      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx !== -1 && idx + 1 < allEpisodes.length) {
        const next = allEpisodes[idx + 1];
        if (next.season !== currentSeason) {
          setSeason(next.season);
        }
        playEp(next, true);
      }
    }

    function fullscreenVideo() {
      const frame = document.getElementById('tv-frame');
      if (frame.requestFullscreen) frame.requestFullscreen();
      else if (frame.webkitRequestFullscreen) frame.webkitRequestFullscreen();
    }

    /* === MOTOR DE NAVEGACIÓN D-PAD NATIVO PARA ANDROID TV === */
    function initDpadController() {
      window.addEventListener('keydown', (e) => {
        switch (e.key) {
          case 'ArrowUp':
          case 'Up':
            moveRow(-1);
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 'Down':
            moveRow(1);
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'Left':
            moveCol(-1);
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'Right':
            moveCol(1);
            e.preventDefault();
            break;
          case 'Enter':
          case 'Select':
          case 'Ok':
            triggerCurrentFocus();
            e.preventDefault();
            break;
        }
      });
    }

    function getElementsInRow(row) {
      return Array.from(document.querySelectorAll(`.tv-target[data-row="${row}"]`));
    }

    function moveRow(delta) {
      let targetRow = currentRow + delta;
      while (targetRow >= 0 && targetRow <= 3) {
        const items = getElementsInRow(targetRow);
        if (items.length > 0) {
          currentRow = targetRow;
          currentCol = Math.min(currentCol, items.length - 1);
          updateFocusUI();
          return;
        }
        targetRow += delta;
      }
    }

    function moveCol(delta) {
      const items = getElementsInRow(currentRow);
      if (items.length === 0) return;
      currentCol = Math.max(0, Math.min(currentCol + delta, items.length - 1));
      updateFocusUI();
    }

    function setFocus(row, col) {
      currentRow = row;
      currentCol = col;
      updateFocusUI();
    }

    function updateFocusUI() {
      // Remover foco previo
      document.querySelectorAll('.tv-active-focus').forEach(el => el.classList.remove('tv-active-focus'));

      const items = getElementsInRow(currentRow);
      if (items.length === 0) return;
      const target = items[currentCol] || items[0];
      target.classList.add('tv-active-focus');

      // Si es carrusel (fila 2 o fila 3), desplazar horizontalmente suave
      if (currentRow === 2 || currentRow === 3) {
        const track = target.parentElement;
        const targetOffsetLeft = target.offsetLeft;
        const centerOffset = (window.innerWidth / 2) - (target.offsetWidth / 2);
        const scrollX = Math.max(0, targetOffsetLeft - centerOffset);
        track.style.transform = `translateX(-${scrollX}px)`;
      }

      // Asegurar que el elemento esté visible verticalmente en pantalla
      target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function triggerCurrentFocus() {
      const items = getElementsInRow(currentRow);
      const target = items[currentCol];
      if (target) {
        target.click();
      }
    }

    init();
  </script>
</body>
</html>
