<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Private Stream TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040711;
      --surface: #0b1220;
      --card-bg: #111a2e;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.6);
      --tv-focus: #38bdf8;
      --tv-glow: rgba(56, 189, 248, 0.9);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #f59e0b;
      --border: rgba(255, 255, 255, 0.08);
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* 1. CATÁLOGO */
    #catalog-view {
      padding: 30px 48px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand-icon {
      background: linear-gradient(135deg, #e50914, #990000);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .brand-title {
      font-weight: 900;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
    }
    .smart-server-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 900;
      margin-bottom: 16px;
      color: #fff;
    }

    .row-scroll-wrapper {
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 6px;
      margin-bottom: 36px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: none; /* Firefox */
      scroll-behavior: smooth;
      cursor: grab;
    }
    .row-scroll-wrapper:active {
      cursor: grabbing;
    }
    .row-scroll-wrapper::-webkit-scrollbar {
      display: none; /* Chrome, Safari, TV WebKit */
    }
    .horizontal-row {
      display: flex;
      gap: 18px;
      width: max-content;
      will-change: transform, scroll-position;
    }

    /* Elementos con Foco */
    .tv-focus-item {
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
    }
    .tv-focus-item.is-focused {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 35px var(--tv-glow) !important;
      transform: scale(1.08) !important;
      z-index: 50 !important;
    }

    .season-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 16px 36px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 900;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .season-btn.selected {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 6px 25px rgba(37, 99, 235, 0.5);
    }

    .ep-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      width: 330px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .ep-card-thumb {
      position: relative;
      width: 100%;
      height: 185px;
      background: #000;
    }
    .ep-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ep-badge-num {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--gold);
    }
    .ep-card-info {
      padding: 18px;
      flex: 1;
    }
    .ep-card-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* 2. REPRODUCTOR PANTALLA COMPLETA */
    #player-view {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
    }
    #player-view.active {
      display: block;
    }
    .video-full-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      border: 0;
      display: block;
      background: #000;
    }

    /* Floating HUD superior */
    .floating-tv-hud {
      position: absolute;
      top: 28px;
      right: 40px;
      display: flex;
      gap: 16px;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .floating-tv-hud.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .hud-button {
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(14px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-button.primary {
      background: var(--accent);
      border-color: #ff3344;
      box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5);
    }
    .hud-button:focus,
    .hud-button.is-focused {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 35px var(--tv-glow) !important;
      transform: scale(1.08);
    }

    /* OVERLAY ESTILO NETFLIX: 5 SEGUNDOS */
    .next-episode-overlay {
      position: absolute;
      bottom: 40px;
      right: 40px;
      background: rgba(10, 16, 30, 0.96);
      border: 2px solid var(--tv-focus);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.95);
      border-radius: 20px;
      padding: 24px 30px;
      z-index: 100005;
      display: none;
      flex-direction: column;
      gap: 12px;
      min-width: 380px;
      animation: popNext 0.3s ease-out;
    }
    @keyframes popNext {
      from { transform: translateY(30px) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    .next-timer-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--tv-focus);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .next-countdown-badge {
      background: var(--accent);
      color: #fff;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 900;
    }
    .next-ep-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .next-ep-sub {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--gold);
    }
    .next-ep-name {
      font-size: 1.3rem;
      font-weight: 900;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .next-ep-actions {
      display: flex;
      gap: 12px;
      margin-top: 6px;
    }
    .next-action-btn {
      flex: 1;
      background: var(--accent);
      border: 2px solid var(--accent);
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }
    .next-action-btn.cancel {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .next-action-btn:focus {
      border-color: var(--tv-focus) !important;
      box-shadow: 0 0 25px var(--tv-glow) !important;
      transform: scale(1.05);
    }

    /* 0. PANTALLA DE BLOQUEO PRIVADO (PIN 2380) */
    #lock-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      user-select: none;
    }
    .lock-card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      border-radius: 24px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 90%;
      text-align: center;
    }
    .lock-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .lock-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 6px;
    }
    .lock-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .pin-display {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }
    .pin-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s ease;
    }
    .pin-dot.filled {
      background: var(--tv-focus);
      border-color: var(--tv-focus);
      box-shadow: 0 0 15px var(--tv-glow);
      transform: scale(1.15);
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
    }
    .pin-key {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid var(--border);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      padding: 16px 0;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pin-key:focus,
    .pin-key.is-focused {
      border-color: var(--tv-focus) !important;
      background: rgba(56, 189, 248, 0.2) !important;
      box-shadow: 0 0 25px var(--tv-glow) !important;
      transform: scale(1.08);
    }
    .lock-error {
      color: #ef4444;
      font-size: 0.9rem;
      font-weight: 800;
      margin-top: 14px;
      min-height: 22px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- 0. PANTALLA PRIVADA CON PIN (2380) -->
  <div id="lock-view">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">Acceso Privado</div>
      <div class="lock-subtitle">Introduce tu PIN de seguridad con el control remoto</div>
      
      <div class="pin-display">
        <div class="pin-dot" id="dot-0"></div>
        <div class="pin-dot" id="dot-1"></div>
        <div class="pin-dot" id="dot-2"></div>
        <div class="pin-dot" id="dot-3"></div>
      </div>

      <div class="pin-keypad">
        <button class="pin-key tv-pin-item" data-pin-key="1">1</button>
        <button class="pin-key tv-pin-item" data-pin-key="2">2</button>
        <button class="pin-key tv-pin-item" data-pin-key="3">3</button>
        <button class="pin-key tv-pin-item" data-pin-key="4">4</button>
        <button class="pin-key tv-pin-item" data-pin-key="5">5</button>
        <button class="pin-key tv-pin-item" data-pin-key="6">6</button>
        <button class="pin-key tv-pin-item" data-pin-key="7">7</button>
        <button class="pin-key tv-pin-item" data-pin-key="8">8</button>
        <button class="pin-key tv-pin-item" data-pin-key="9">9</button>
        <button class="pin-key tv-pin-item" data-pin-key="clear" style="font-size: 1.1rem; color: #f87171;">⌫</button>
        <button class="pin-key tv-pin-item" data-pin-key="0">0</button>
        <button class="pin-key tv-pin-item" data-pin-key="ok" style="font-size: 1.1rem; color: #34d399;">✓</button>
      </div>
      
      <div class="lock-error" id="lock-error-msg"></div>
    </div>
  </div>

  <!-- 1. VISTA CATÁLOGO -->
  <div id="catalog-view" style="display: none;">
    <header>
      <div class="brand">
        <div class="brand-icon">M</div>
        <div class="brand-title">El Mentalista</div>
      </div>
      <div class="smart-server-badge">
        <span>⚡ Servidor Óptimo Automático</span>
      </div>
    </header>

    <div class="section-title">📅 Temporadas (1 a 7):</div>
    <div class="row-scroll-wrapper">
      <div class="horizontal-row" id="seasons-row"></div>
    </div>

    <div class="section-title" id="episodes-title">🎬 Episodios Temporada 1:</div>
    <div class="row-scroll-wrapper">
      <div class="horizontal-row" id="episodes-row"></div>
    </div>
  </div>

  <!-- 2. VISTA REPRODUCTOR -->
  <div id="player-view">
    <div class="floating-tv-hud" id="tv-hud">
      <button class="hud-button primary" id="hud-btn-next" onclick="triggerNextCountdown(5)">
        ⏭️ Siguiente Episodio
      </button>
      <button class="hud-button" id="hud-btn-exit" onclick="closePlayerView()">
        ✖ Salir al Menú
      </button>
    </div>

    <!-- TARJETA NETFLIX CUENTA REGRESIVA 5 SEGUNDOS -->
    <div class="next-episode-overlay" id="next-overlay">
      <div class="next-timer-label">
        <span>Siguiente Episodio en</span>
        <span class="next-countdown-badge" id="next-countdown-sec">5s</span>
      </div>
      <div class="next-ep-details">
        <span class="next-ep-sub" id="next-ep-sub">TEMPORADA 1 : EPISODIO 2</span>
        <span class="next-ep-name" id="next-ep-name">Pelo rojo y cinta plateada</span>
      </div>
      <div class="next-ep-actions">
        <button class="next-action-btn" id="btn-play-now" onclick="playNextImmediately()">
          Ver Ahora
        </button>
        <button class="next-action-btn cancel" id="btn-cancel-next" onclick="cancelNextCountdown()">
          Cancelar
        </button>
      </div>
    </div>

    <div id="cinema-frame-container"></div>
  </div>

  <script>
    let allEpisodes = [];
    let currentSeason = 1;
    let currentEp = null;

    let currentRow = 0;
    let currentCol = 0;
    let isPlaying = false;
    let hudTimer = null;

    let countdownInterval = null;
    let countdownSeconds = 5;
    let isCountdownActive = false;

    const SERVER_PRIORITY = [
      "hyper",
      "morencius",
      "nebula",
      "martinshop",
      "goldmember",
      "death star",
      "vidlink",
      "trinity"
    ];

    function pickBestServer(servers) {
      if (!servers || servers.length === 0) return "";
      for (const rank of SERVER_PRIORITY) {
        const match = servers.find(s => 
          (s.server && s.server.toLowerCase().includes(rank)) ||
          (s.embed_url && s.embed_url.toLowerCase().includes(rank))
        );
        if (match) return match.embed_url;
      }
      return servers[0].embed_url;
    }

    const CORRECT_PIN = "2380";
    let enteredPin = "";
    let isLocked = true;
    let pinRow = 0;
    let pinCol = 0;
    const PIN_KEYPAD_GRID = [
      ["1", "2", "3"],
      ["4", "5", "6"],
      ["7", "8", "9"],
      ["clear", "0", "ok"]
    ];

    function checkAuth() {
      if (sessionStorage.getItem('tv_auth') === 'granted') {
        unlockApp();
      } else {
        showLockScreen();
      }
    }

    function showLockScreen() {
      isLocked = true;
      document.getElementById('lock-view').style.display = 'flex';
      document.getElementById('catalog-view').style.display = 'none';
      updatePinDisplay();
      updatePinFocus();
    }

    function updatePinDisplay() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (dot) {
          if (i < enteredPin.length) dot.classList.add('filled');
          else dot.classList.remove('filled');
        }
      }
    }

    function updatePinFocus() {
      document.querySelectorAll('.tv-pin-item').forEach(el => el.classList.remove('is-focused'));
      const key = PIN_KEYPAD_GRID[pinRow][pinCol];
      const target = document.querySelector(`.tv-pin-item[data-pin-key="${key}"]`);
      if (target) {
        target.classList.add('is-focused');
        target.focus();
      }
    }

    function pressPinKey(key) {
      const errEl = document.getElementById('lock-error-msg');
      if (errEl) errEl.textContent = '';

      if (key === 'clear') {
        enteredPin = enteredPin.slice(0, -1);
        updatePinDisplay();
        return;
      }

      if (key === 'ok') {
        submitPin();
        return;
      }

      if (enteredPin.length < 4) {
        enteredPin += key;
        updatePinDisplay();
        if (enteredPin.length === 4) {
          setTimeout(submitPin, 150);
        }
      }
    }

    function submitPin() {
      if (enteredPin === CORRECT_PIN) {
        sessionStorage.setItem('tv_auth', 'granted');
        unlockApp();
      } else {
        const errEl = document.getElementById('lock-error-msg');
        if (errEl) errEl.textContent = '❌ PIN incorrecto. Intenta de nuevo.';
        enteredPin = '';
        updatePinDisplay();
      }
    }

    function unlockApp() {
      isLocked = false;
      document.getElementById('lock-view').style.display = 'none';
      document.getElementById('catalog-view').style.display = 'block';
      if (allEpisodes.length === 0) {
        init();
      } else {
        updateFocusUI();
      }
    }

    // Inicializar eventos de clic en teclado PIN
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.tv-pin-item').forEach(btn => {
        btn.addEventListener('click', () => {
          pressPinKey(btn.dataset.pinKey);
        });
      });
    });

    async function init() {
      try {
        const res = await fetch('episodes.json?v=' + Date.now());
        allEpisodes = await res.json();

        renderSeasons();
        selectSeason(1);

        setupDpadController();
        updateFocusUI();
      } catch (e) {
        console.error("Error cargando episodios:", e);
      }
    }

    function renderSeasons() {
      const seasons = [...new Set(allEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const row = document.getElementById('seasons-row');
      row.innerHTML = '';

      seasons.forEach((s, idx) => {
        const btn = document.createElement('div');
        btn.className = `season-btn tv-focus-item ${s === currentSeason ? 'selected' : ''}`;
        btn.dataset.row = '0';
        btn.dataset.col = idx;
        btn.textContent = `Temporada ${s}`;
        btn.onclick = () => {
          selectSeason(s);
          setFocus(0, idx);
        };
        row.appendChild(btn);
      });
    }

    function selectSeason(seasonNum) {
      currentSeason = seasonNum;
      document.querySelectorAll('.season-btn').forEach((btn, idx) => {
        btn.classList.toggle('selected', idx + 1 === seasonNum);
      });
      const filtered = allEpisodes.filter(e => e.season === seasonNum);
      document.getElementById('episodes-title').textContent = `🎬 Episodios Temporada ${seasonNum} (${filtered.length} Capítulos):`;
      renderEpisodes();
      const epWrapper = document.getElementById('episodes-row').closest('.row-scroll-wrapper');
      if (epWrapper) epWrapper.scrollTo({ left: 0, behavior: 'smooth' });
    }

    function renderEpisodes() {
      const filtered = allEpisodes.filter(e => e.season === currentSeason);
      const row = document.getElementById('episodes-row');
      row.innerHTML = '';

      filtered.forEach((ep, idx) => {
        const card = document.createElement('div');
        card.className = `ep-card tv-focus-item`;
        card.dataset.row = '1';
        card.dataset.col = idx;

        card.onclick = () => {
          launchEpisode(ep);
        };

        const posterImg = ep.poster || 'https://image.tmdb.org/t/p/w500/snKUzvCl3kGv0RWBjEjnOXMGvdl.jpg';
        card.innerHTML = `
          <div class="ep-card-thumb">
            <img src="${posterImg}" alt="T${ep.season} E${ep.episode}">
            <div class="ep-badge-num">T${ep.season} : E${ep.episode}</div>
          </div>
          <div class="ep-card-info">
            <div class="ep-card-title">${ep.title}</div>
            <div class="ep-card-desc">${ep.overview || 'Sin descripción disponible.'}</div>
          </div>
        `;
        row.appendChild(card);
      });
    }

    function launchEpisode(ep) {
      currentEp = ep;
      isPlaying = true;
      cancelNextCountdown();

      const bestUrl = pickBestServer(ep.servers);
      const container = document.getElementById('cinema-frame-container');
      container.innerHTML = '';

      const frame = document.createElement('iframe');
      frame.id = 'cinema-frame';
      frame.className = 'video-full-frame';
      frame.allowFullscreen = true;
      frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
      frame.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      frame.removeAttribute('sandbox'); // Asegura 100% que ningún sandbox residual exista
      frame.src = bestUrl;
      container.appendChild(frame);

      document.getElementById('catalog-view').style.display = 'none';
      const playerEl = document.getElementById('player-view');
      playerEl.classList.add('active');

      try {
        if (playerEl.requestFullscreen) playerEl.requestFullscreen();
        else if (playerEl.webkitRequestFullscreen) playerEl.webkitRequestFullscreen();
      } catch (err) {}
    }

    function closePlayerView() {
      isPlaying = false;
      cancelNextCountdown();

      const playerEl = document.getElementById('player-view');
      playerEl.classList.remove('active');
      const container = document.getElementById('cinema-frame-container');
      if (container) container.innerHTML = '';
      document.getElementById('catalog-view').style.display = 'block';

      try {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } catch (e) {}

      setFocus(1, currentCol);
    }

    /* === CUENTA REGRESIVA DE 5 SEGUNDOS GARANTIZADA === */
    function triggerNextCountdown(seconds = 5) {
      if (!currentEp || isCountdownActive) return;

      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx === -1 || idx + 1 >= allEpisodes.length) return; // Fin de catálogo

      const nextEp = allEpisodes[idx + 1];
      isCountdownActive = true;
      countdownSeconds = seconds;

      document.getElementById('next-ep-sub').textContent = `TEMPORADA ${nextEp.season} : EPISODIO ${nextEp.episode}`;
      document.getElementById('next-ep-name').textContent = nextEp.title;
      document.getElementById('next-countdown-sec').textContent = `${countdownSeconds}s`;

      const overlay = document.getElementById('next-overlay');
      overlay.style.display = 'flex';

      // Foco en Ver Ahora para el control remoto
      document.getElementById('btn-play-now').focus();

      if (countdownInterval) clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdownSeconds--;
        if (countdownSeconds > 0) {
          document.getElementById('next-countdown-sec').textContent = `${countdownSeconds}s`;
        } else {
          clearInterval(countdownInterval);
          playNextImmediately();
        }
      }, 1000);
    }

    function playNextImmediately() {
      cancelNextCountdown();
      const idx = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (idx !== -1 && idx + 1 < allEpisodes.length) {
        const next = allEpisodes[idx + 1];
        if (next.season !== currentSeason) {
          selectSeason(next.season);
        }
        launchEpisode(next);
      }
    }

    function cancelNextCountdown() {
      isCountdownActive = false;
      if (countdownInterval) clearInterval(countdownInterval);
      document.getElementById('next-overlay').style.display = 'none';
    }

    function showHudTemp(focusNext = false) {
      const hud = document.getElementById('tv-hud');
      hud.classList.add('visible');
      if (focusNext) {
        document.getElementById('hud-btn-next').focus();
      }
      if (hudTimer) clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        hud.classList.remove('visible');
      }, 5000);
    }

    /* === NAVEGACIÓN D-PAD CONTROL REMOTO === */
    function setupDpadController() {
      window.addEventListener('keydown', (e) => {
        // 1. Manejo en Pantalla de Bloqueo (PIN 2380)
        if (isLocked) {
          if (e.key >= '0' && e.key <= '9') {
            pressPinKey(e.key);
            e.preventDefault();
            return;
          }
          if (e.key === 'Backspace') {
            pressPinKey('clear');
            e.preventDefault();
            return;
          }
          if (e.key === 'ArrowUp' || e.key === 'Up') {
            if (pinRow > 0) pinRow--;
            updatePinFocus();
            e.preventDefault();
            return;
          }
          if (e.key === 'ArrowDown' || e.key === 'Down') {
            if (pinRow < PIN_KEYPAD_GRID.length - 1) pinRow++;
            updatePinFocus();
            e.preventDefault();
            return;
          }
          if (e.key === 'ArrowLeft' || e.key === 'Left') {
            if (pinCol > 0) pinCol--;
            updatePinFocus();
            e.preventDefault();
            return;
          }
          if (e.key === 'ArrowRight' || e.key === 'Right') {
            if (pinCol < 2) pinCol++;
            updatePinFocus();
            e.preventDefault();
            return;
          }
          if (e.key === 'Enter' || e.key === 'Ok' || e.key === 'Select') {
            const key = PIN_KEYPAD_GRID[pinRow][pinCol];
            pressPinKey(key);
            e.preventDefault();
            return;
          }
          return;
        }

        if (isPlaying) {
          if (isCountdownActive) {
            if (e.key === 'ArrowRight') {
              document.getElementById('btn-cancel-next').focus();
              e.preventDefault();
            } else if (e.key === 'ArrowLeft') {
              document.getElementById('btn-play-now').focus();
              e.preventDefault();
            } else if (e.key === 'Enter' || e.key === 'Ok') {
              if (document.activeElement && document.activeElement.click) {
                document.activeElement.click();
              }
              e.preventDefault();
            } else if (e.key === 'Back' || e.key === 'Escape') {
              cancelNextCountdown();
              e.preventDefault();
            }
            return;
          }

          // Tecla Atrás del control remoto
          if (e.key === 'Back' || e.key === 'Escape' || e.key === 'BrowserBack') {
            closePlayerView();
            e.preventDefault();
            return;
          }

          const hud = document.getElementById('tv-hud');
          const isHudVisible = hud.classList.contains('visible');

          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            showHudTemp();
            document.getElementById('hud-btn-exit').focus();
            e.preventDefault();
            return;
          }

          if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            showHudTemp();
            document.getElementById('hud-btn-next').focus();
            e.preventDefault();
            return;
          }

          if (e.key === 'Enter' || e.key === 'Ok') {
            if (isHudVisible && document.activeElement && (document.activeElement.id === 'hud-btn-next' || document.activeElement.id === 'hud-btn-exit')) {
              document.activeElement.click();
            } else {
              // Si la barra está oculta, el primer OK solo la muestra y enfoca el botón sin saltar
              showHudTemp(true);
            }
            e.preventDefault();
            return;
          }
          return;
        }

        switch (e.key) {
          case 'ArrowUp':
          case 'Up':
            moveRow(-1);
            e.preventDefault();
            break;
          case 'ArrowDown':
          case 'Down':
            moveRow(1);
            e.preventDefault();
            break;
          case 'ArrowLeft':
          case 'Left':
            moveCol(-1);
            e.preventDefault();
            break;
          case 'ArrowRight':
          case 'Right':
            moveCol(1);
            e.preventDefault();
            break;
          case 'Enter':
          case 'Select':
          case 'Ok':
            triggerSelection();
            e.preventDefault();
            break;
        }
      });
    }

    function getRowItems(row) {
      return Array.from(document.querySelectorAll(`.tv-focus-item[data-row="${row}"]`));
    }

    function moveRow(delta) {
      let nextRow = currentRow + delta;
      if (nextRow >= 0 && nextRow <= 1) {
        currentRow = nextRow;
        const items = getRowItems(currentRow);
        currentCol = Math.min(currentCol, items.length - 1);
        updateFocusUI();
      }
    }

    function moveCol(delta) {
      const items = getRowItems(currentRow);
      if (items.length === 0) return;
      currentCol = Math.max(0, Math.min(currentCol + delta, items.length - 1));
      updateFocusUI();
    }

    function setFocus(row, col) {
      currentRow = row;
      currentCol = col;
      updateFocusUI();
    }

    function updateFocusUI() {
      document.querySelectorAll('.is-focused').forEach(el => el.classList.remove('is-focused'));

      const items = getRowItems(currentRow);
      if (items.length === 0) return;
      const target = items[currentCol] || items[0];
      target.classList.add('is-focused');

      const container = target.closest('.row-scroll-wrapper');
      if (container) {
        const targetOffsetLeft = target.offsetLeft;
        const centerOffset = (container.clientWidth / 2) - (target.offsetWidth / 2);
        const scrollX = Math.max(0, targetOffsetLeft - centerOffset);
        container.scrollTo({ left: scrollX, behavior: 'smooth' });
      }
    }

    function triggerSelection() {
      const items = getRowItems(currentRow);
      const target = items[currentCol];
      if (target) target.click();
    }

    function setupDragToScroll() {
      document.querySelectorAll('.row-scroll-wrapper').forEach(wrapper => {
        let isDown = false;
        let startX;
        let scrollLeft;

        wrapper.addEventListener('mousedown', (e) => {
          isDown = true;
          wrapper.classList.add('active');
          startX = e.pageX - wrapper.offsetLeft;
          scrollLeft = wrapper.scrollLeft;
        });

        wrapper.addEventListener('mouseleave', () => {
          isDown = false;
        });

        wrapper.addEventListener('mouseup', () => {
          isDown = false;
        });

        wrapper.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - wrapper.offsetLeft;
          const walk = (x - startX) * 1.5; // Velocidad de arrastre
          wrapper.scrollLeft = scrollLeft - walk;
        });
      });
    }

    setupDpadController();
    checkAuth();
    setTimeout(setupDragToScroll, 500);
  </script>
</body>
