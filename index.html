<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Mentalista - Serie Completa HD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050811;
      --surface: #0e1424;
      --surface-hover: #162038;
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --gold: #f59e0b;
      --green: #10b981;
      --blue: #3b82f6;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* Top Bar */
    header {
      background: rgba(5, 8, 17, 0.95);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      background: linear-gradient(135deg, #e50914, #990000);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.3rem;
      box-shadow: 0 4px 18px var(--accent-glow);
    }
    .brand-title {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.4px;
    }
    .tv-direct-pill {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tv-direct-pill code {
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 8px;
      border-radius: 6px;
      color: #fff;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Player Section */
    .player-theater {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 16px 45px rgba(0,0,0,0.85);
      border: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Cinema */
      background: #000;
    }
    .video-viewport iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Player Controls & Info */
    .player-info-bar {
      padding: 20px 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .meta-headline {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .now-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .now-tag {
      background: var(--accent);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .now-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
      max-width: 900px;
    }

    /* Audio / Server Picker */
    .section-label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .servers-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .server-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .server-btn:hover {
      background: var(--surface-hover);
      border-color: var(--blue);
      transform: translateY(-1px);
    }
    .server-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    /* Actions Bar */
    .quick-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: var(--surface-hover);
    }

    /* Seasons Navigation */
    .seasons-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 22px;
      scrollbar-width: thin;
    }
    .season-tab {
      padding: 11px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .season-tab:hover {
      color: #fff;
      background: var(--surface-hover);
    }
    .season-tab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
    }

    /* Episode Cards Grid */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .ep-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .ep-card:hover {
      transform: translateY(-4px);
      border-color: var(--blue);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .ep-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .ep-thumbnail-box {
      position: relative;
      width: 100%;
      height: 155px;
      background: #020409;
    }
    .ep-thumbnail-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ep-num-pill {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--gold);
    }
    .ep-content {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .ep-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .ep-synopsis {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.45;
      flex: 1;
    }
    .ep-foot {
      margin-top: 10px;
      font-size: 0.74rem;
      color: var(--green);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">M</div>
      <div>
        <div class="brand-title">El Mentalista</div>
      </div>
    </div>
    <div class="tv-direct-pill">
      <span>📺 En tu Android TV:</span>
      <code>http://192.168.40.80:8088</code>
    </div>
  </header>

  <div class="container">
    <!-- Reproductor Principal -->
    <div class="player-theater" id="player-anchor">
      <div class="video-viewport">
        <iframe id="main-video" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>

      <div class="player-info-bar">
        <div class="meta-headline">
          <div class="now-title" id="now-title">Cargando episodio...</div>
          <div class="now-tag" id="now-tag">T1 E1</div>
        </div>
        <div class="now-desc" id="now-desc">Cargando sinopsis de Patrick Jane...</div>

        <!-- Servidores de Audio y Calidad -->
        <div class="section-label">⚡ Servidores y Audios Disponibles:</div>
        <div class="servers-grid" id="servers-container"></div>

        <!-- Acciones rápidas -->
        <div class="quick-actions">
          <button class="action-btn" onclick="reloadCurrentVideo()">
            🔄 Recargar Reproductor
          </button>
          <button class="action-btn" onclick="nextEpisode()">
            ⏭️ Siguiente Episodio
          </button>
        </div>
      </div>
    </div>

    <!-- Pestañas de Temporadas -->
    <div class="seasons-bar" id="seasons-container"></div>

    <!-- Lista de Episodios -->
    <div class="episodes-grid" id="episodes-container"></div>
  </div>

  <script>
    let allEpisodes = [];
    let currentSeason = 1;
    let currentEp = null;
    let currentServer = null;

    async function initApp() {
      try {
        const res = await fetch('episodes.json');
        allEpisodes = await res.json();
        
        setupSeasons();
        selectSeason(1);

        // Auto-reproducir el primer episodio (T1E1) de inmediato
        if (allEpisodes.length > 0) {
          playEpisode(allEpisodes[0], false);
        }
      } catch (err) {
        console.error("Error al cargar episodios:", err);
      }
    }

    function setupSeasons() {
      const seasons = [...new Set(allEpisodes.map(e => e.season))].sort((a, b) => a - b);
      const container = document.getElementById('seasons-container');
      container.innerHTML = '';
      seasons.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `season-tab ${s === currentSeason ? 'active' : ''}`;
        btn.textContent = `Temporada ${s}`;
        btn.onclick = () => selectSeason(s);
        container.appendChild(btn);
      });
    }

    function selectSeason(seasonNum) {
      currentSeason = seasonNum;
      document.querySelectorAll('.season-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.textContent === `Temporada ${seasonNum}`);
      });
      renderEpisodes();
    }

    function renderEpisodes() {
      const filtered = allEpisodes.filter(e => e.season === currentSeason);
      const container = document.getElementById('episodes-container');
      container.innerHTML = '';

      filtered.forEach(ep => {
        const card = document.createElement('div');
        const isActive = currentEp && currentEp.season === ep.season && currentEp.episode === ep.episode;
        card.className = `ep-card ${isActive ? 'active' : ''}`;
        card.onclick = () => playEpisode(ep, true);

        const posterImg = ep.poster || 'https://image.tmdb.org/t/p/w500/snKUzvCl3kGv0RWBjEjnOXMGvdl.jpg';
        card.innerHTML = `
          <div class="ep-thumbnail-box">
            <img src="${posterImg}" alt="T${ep.season} E${ep.episode}" loading="lazy">
            <div class="ep-num-pill">T${ep.season} : E${ep.episode}</div>
          </div>
          <div class="ep-content">
            <div class="ep-title">${ep.title}</div>
            <div class="ep-synopsis">${ep.overview || 'Sin descripción disponible.'}</div>
            <div class="ep-foot">⚡ ${ep.servers.length} Opciones de Streaming</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function playEpisode(ep, scrollToPlayer = false) {
      currentEp = ep;
      renderEpisodes();

      document.getElementById('now-title').textContent = ep.title;
      document.getElementById('now-tag').textContent = `T${ep.season} : E${ep.episode}`;
      document.getElementById('now-desc').textContent = ep.overview || 'Patrick Jane y el equipo del CBI investigan este caso.';

      const serversBox = document.getElementById('servers-container');
      serversBox.innerHTML = '';

      if (!ep.servers || ep.servers.length === 0) {
        serversBox.innerHTML = '<span style="color:#ef4444; font-size:0.9rem;">No hay servidores disponibles para este episodio.</span>';
        return;
      }

      // Priorizar Morencius (Hyper) o el primer servidor disponible
      currentServer = ep.servers[0];

      ep.servers.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.className = `server-btn ${idx === 0 ? 'active' : ''}`;
        btn.innerHTML = `<span>▶</span> <span>${srv.language} (${srv.server})</span>`;
        btn.onclick = () => {
          document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentServer = srv;
          loadStream(srv.embed_url);
        };
        serversBox.appendChild(btn);
      });

      loadStream(currentServer.embed_url);

      if (scrollToPlayer) {
        document.getElementById('player-anchor').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function loadStream(url) {
      const frame = document.getElementById('main-video');
      frame.src = url;
    }

    function reloadCurrentVideo() {
      if (currentServer) {
        loadStream(currentServer.embed_url);
      }
    }

    function nextEpisode() {
      if (!currentEp) return;
      const currentIndex = allEpisodes.findIndex(e => e.season === currentEp.season && e.episode === currentEp.episode);
      if (currentIndex !== -1 && currentIndex + 1 < allEpisodes.length) {
        const nextEp = allEpisodes[currentIndex + 1];
        if (nextEp.season !== currentSeason) {
          selectSeason(nextEp.season);
        }
        playEpisode(nextEp, true);
      } else {
        alert("¡Has llegado al final de la serie!");
      }
    }

    initApp();
  </script>
</body>
</html>
